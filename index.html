function loadImages(cb){
  let n=0;
  ['s1','s2'].forEach((key,i)=>{
    const img=new Image();
    img.onload=()=>{ imgs[key]=img; n++; if(n===2){imgsReady=true;cb();} };
    img.onerror=()=>{ console.warn('img failed:',key); n++; if(n===2){imgsReady=true;cb();} };
    img.src=['1000062701.png','1000062699.png'][i];
  });
}

// drawSp — top-left coords, rot en radians
function drawSp(sheet,sp,x,y,w,h,rot=0,alpha=1){
  const img=imgs[sheet];
  if(!img||!sp) return;
  ctx.save();
  if(alpha!==1) ctx.globalAlpha=alpha;
  ctx.translate(x+w/2, y+h/2);
  if(rot) ctx.rotate(rot);
  ctx.drawImage(img, sp.x,sp.y,sp.w,sp.h, -w/2,-h/2, w,h);
  ctx.restore();
}

// ─────────────────────────────────────────────────────────────────
//  AUDIO

let AC=null,masterG=null,musicG=null,sfxG=null,musicOn=false;

function getAC(){
  if(!AC){ AC=new(window.AudioContext||window.webkitAudioContext)(); }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function initAudio(){
  if(masterG) return;
  const ac=getAC();
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-12; comp.ratio.value=4; comp.connect(ac.destination);
  masterG=ac.createGain(); masterG.gain.value=0.85; masterG.connect(comp);
  musicG=ac.createGain(); musicG.gain.value=0.5;  musicG.connect(masterG);
  sfxG  =ac.createGain(); sfxG.gain.value=0.7;    sfxG.connect(masterG);
}

function sfxLaser(lvl){
  if(!sfxG) return;
  const ac=getAC(),t=ac.currentTime;
  const pairs=[[900,380],[800,320],[700,260],[1100,480],[600,180],[500,130],[450,110],[400,90]];
  const [f1,f2]=pairs[Math.min(lvl,pairs.length-1)];
  const o=ac.createOscillator(),g=ac.createGain();
  const ws=ac.createWaveShaper(); const c=new Float32Array(256);
  for(let i=0;i<256;i++){const x=i*2/256-1;c[i]=Math.tanh(x*4);} ws.curve=c;
  o.type=lvl<2?'square':'sawtooth';
  o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(f2,t+0.11);
  g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  o.connect(ws); ws.connect(g); g.connect(sfxG);
  o.start(t); o.stop(t+0.13);
}
function sfxBoom(big){
  if(!sfxG) return;
  const ac=getAC(),t=ac.currentTime,dur=big?0.55:0.25;
  const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,big?1.1:1.6);
  const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
  f.type='lowpass'; f.frequency.value=big?500:1100;
  s.buffer=buf;
  g.gain.setValueAtTime(big?0.85:0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(sfxG); s.start(t);
}
function sfxPickup(){
  if(!sfxG) return;
  const ac=getAC(),t=ac.currentTime;
  [0,0.06,0.12].forEach((dt,i)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.value=440+i*220;
    g.gain.setValueAtTime(0.22,t+dt); g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.1);
    o.connect(g); g.connect(sfxG); o.start(t+dt); o.stop(t+dt+0.11);
  });
}
function sfxHurt(){
  if(!sfxG) return;
  const ac=getAC(),t=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(55,t+0.2);
  g.gain.setValueAtTime(0.45,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
  o.connect(g); g.connect(sfxG); o.start(t); o.stop(t+0.23);
}
function sfxWpnUp(){
  if(!sfxG) return;
  const ac=getAC(),t=ac.currentTime;
  [0,0.07,0.14,0.21,0.28].forEach((dt,i)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='square'; o.frequency.value=300+i*180;
    g.gain.setValueAtTime(0.28,t+dt); g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.08);
    o.connect(g); g.connect(sfxG); o.start(t+dt); o.stop(t+dt+0.09);
  });
}
function sfxBossRoar(){
  if(!sfxG) return;
  const ac=getAC(),t=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain(),ws=ac.createWaveShaper();
  const c=new Float32Array(512); for(let i=0;i<512;i++){const x=i*2/512-1;c[i]=Math.sign(x)*Math.pow(Math.abs(x),0.25);} ws.curve=c;
  o.type='sawtooth'; o.frequency.setValueAtTime(55,t); o.frequency.exponentialRampToValueAtTime(38,t+1.0);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.75,t+0.08); g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
  o.connect(ws); ws.connect(g); g.connect(sfxG); o.start(t); o.stop(t+1.1);
}

// ── Musique procédurale rock arcade ──────────────────────────────
const N=(n)=>440*Math.pow(2,(n-69)/12);
const BASS=[57,57,55,57,60,60,58,57,55,55,53,55,52,52,50,52];
const LEAD=[69,72,69,67,69,0,72,74,76,74,72,74,72,69,0,0];

function startMusic(){
  if(musicOn) return; musicOn=true;
  if(!musicG) initAudio();
  const ac=getAC(),BPM=148,STEP=60/BPM/4;

  // distorsion guitare
  const dw=new Float32Array(512);
  for(let i=0;i<512;i++){const x=i*2/512-1;dw[i]=Math.tanh(x*5)*0.75;}
  const dist=ac.createWaveShaper(); dist.curve=dw;

  // reverb simple
  const rev=ac.createConvolver();
  const rl=ac.sampleRate*0.35,rb=ac.createBuffer(2,rl,ac.sampleRate);
  for(let c=0;c<2;c++){const d=rb.getChannelData(c);for(let i=0;i<rl;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,1.8);}
  rev.buffer=rb;

  const lgain=ac.createGain(); lgain.gain.value=0.18; lgain.connect(musicG);
  const delay=ac.createDelay(0.5); delay.delayTime.value=STEP*8;
  const dg=ac.createGain(); dg.gain.value=0.22;
  dist.connect(rev); rev.connect(lgain);
  dist.connect(delay); delay.connect(dg); dg.connect(lgain);

  const bgain=ac.createGain(); bgain.gain.value=0.32; bgain.connect(musicG);
  const bdw=new Float32Array(256); for(let i=0;i<256;i++){const x=i*2/256-1;bdw[i]=Math.tanh(x*2);}
  const bdist=ac.createWaveShaper(); bdist.curve=bdw; bdist.connect(bgain);

  const padG=ac.createGain(); padG.gain.value=0.07; padG.connect(musicG);

  let step=0,startT=ac.currentTime+0.05;

  function tick(){
    if(!musicOn) return;
    const ac2=getAC(),t=startT+step*STEP,beat=step%16,bar=Math.floor(step/16)%4;

    // BASSE
    if(beat%2===0){
      const bn=BASS[beat];
      const o=ac2.createOscillator(),g=ac2.createGain();
      o.type='sawtooth'; o.frequency.value=N(bn);
      g.gain.setValueAtTime(0.65,t); g.gain.exponentialRampToValueAtTime(0.001,t+STEP*1.7);
      o.connect(g); g.connect(bdist); o.start(t); o.stop(t+STEP*1.8);
    }

    // LEAD
    const ln=LEAD[beat];
    if(ln>0){
      const freq=N(bar>=2?ln+12:ln);
      const o=ac2.createOscillator(),o2=ac2.createOscillator(),g=ac2.createGain();
      o.type='sawtooth'; o.frequency.value=freq;
      o2.type='sawtooth'; o2.frequency.value=freq*1.006;
      g.gain.setValueAtTime(0.55,t); g.gain.exponentialRampToValueAtTime(0.001,t+STEP*0.82);
      o.connect(g); o2.connect(g); g.connect(dist);
      o.start(t); o2.start(t); o.stop(t+STEP*0.85); o2.stop(t+STEP*0.85);
    }

    // KICK
    if(beat===0||beat===4||beat===8||beat===12){
      const o=ac2.createOscillator(),g=ac2.createGain();
      o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+0.08);
      g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.17);
      o.connect(g); g.connect(musicG); o.start(t); o.stop(t+0.18);
    }
    // SNARE
    if(beat===4||beat===12){
      const buf=ac2.createBuffer(1,ac2.sampleRate*0.16,ac2.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.1);
      const s=ac2.createBufferSource(),g=ac2.createGain(),hp=ac2.createBiquadFilter();
      hp.type='highpass'; hp.frequency.value=1800; s.buffer=buf;
      g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      s.connect(hp); hp.connect(g); g.connect(musicG); s.start(t);
    }
    // HIHAT
    if(step%2===0){
      const open=beat===2||beat===6||beat===10||beat===14;
      const dur=open?0.1:0.035;
      const buf=ac2.createBuffer(1,ac2.sampleRate*dur,ac2.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,0.7);
      const s=ac2.createBufferSource(),g=ac2.createGain(),hp=ac2.createBiquadFilter();
      hp.type='highpass'; hp.frequency.value=9000; s.buffer=buf;
      g.gain.setValueAtTime(open?0.16:0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      s.connect(hp); hp.connect(g); g.connect(musicG); s.start(t);
    }
    // PAD
    if(beat===0){
      [57,60,64].forEach(n=>{
        const o=ac2.createOscillator(),g=ac2.createGain();
        o.type='sine'; o.frequency.value=N(n-12);
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.25,t+0.3);
        g.gain.setValueAtTime(0.25,t+STEP*14); g.gain.linearRampToValueAtTime(0,t+STEP*16);
        o.connect(g); g.connect(padG); o.start(t); o.stop(t+STEP*16+0.1);
      });
    }

    step++;
    const ahead=(startT+step*STEP)-ac2.currentTime;
    setTimeout(tick,Math.max(0,(ahead-0.1)*1000));
  }
  tick();
}
function stopMusic(){ musicOn=false; }

function boxHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function circHit(ax,ay,ar,bx,by,br){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy<(ar+br)*(ar+br);}

//  PARTICLES
// ─────────────────────────────────────────────────────────────────
class Particle{
  constructor(x,y,col,vx,vy,life,sz){
    this.x=x;this.y=y;this.col=col;
    this.vx=vx!=null?vx:(Math.random()-.5)*220;
    this.vy=vy!=null?vy:(Math.random()-.5)*220;
    this.life=life||(0.4+Math.random()*0.5);
    this.maxL=this.life;
    this.sz=sz||(Math.floor(Math.random()*4)+2);
    this.dead=false;
  }
  update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.life-=dt;if(this.life<=0)this.dead=true;}
  draw(){ctx.globalAlpha=this.life/this.maxL;ctx.fillStyle=this.col;ctx.fillRect(this.x|0,this.y|0,this.sz,this.sz);ctx.globalAlpha=1;}
}
function burst(x,y,col,n=10){for(let i=0;i<n;i++)particles.push(new Particle(x,y,col));}
function bigBurst(x,y){['#f80','#fc0','#f44','#fff'].forEach(c=>{for(let i=0;i<9;i++)particles.push(new Particle(x,y,c,null,null,0.5+Math.random()*0.7,Math.floor(Math.random()*5)+2));});}

function showMsg(txt,col='#fff'){floatMsgs.push({txt,col,x:CW/2,y:CH/2-40,life:1.8,maxL:1.8,dead:false});}
function updMsgs(dt){floatMsgs.forEach(m=>{m.y-=28*dt;m.life-=dt;if(m.life<=0)m.dead=true;});floatMsgs=floatMsgs.filter(m=>!m.dead);}
function drwMsgs(){floatMsgs.forEach(m=>{ctx.save();ctx.globalAlpha=m.life/m.maxL;ctx.fillStyle=m.col;ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.fillText(m.txt,m.x,m.y);ctx.restore();});}

// ─────────────────────────────────────────────────────────────────
//  BULLET  — cx,cy = centre à la création
// ─────────────────────────────────────────────────────────────────
class Bullet{
  constructor(cx,cy,vx,vy,dmg,owner,wpn){
    this.vx=vx;this.vy=vy;this.dmg=dmg;this.owner=owner;this.wpn=wpn;
    this.w=wpn.rw;this.h=wpn.rh;
    this.x=cx-this.w/2;  // top-left
    this.y=cy-this.h/2;
    this.dead=false;
  }
  update(dt){
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    if(this.y<-120||this.y>CH+120||this.x<-120||this.x>CW+120)this.dead=true;
  }
  draw(){
    const angle=Math.atan2(this.vx,-this.vy);
    drawSp(this.wpn.sheet,this.wpn.sp,this.x,this.y,this.w,this.h,angle);
  }
}

// ─────────────────────────────────────────────────────────────────
//  POWERUP
// ─────────────────────────────────────────────────────────────────
class PowerUp{
  constructor(x,y,type){this.type=type;this.w=26;this.h=26;this.x=x-13;this.y=y-13;this.vy=50;this.dead=false;this.t=Math.random()*6.28;}
  update(dt){this.y+=this.vy*dt;this.t+=dt;if(this.y>CH+40)this.dead=true;}
  draw(){
    const bob=Math.sin(this.t*3.5)*3;
    const map={hp:['s1',S1.heart],shield:['s2',S2.shield],weapon:['s1',S1.starFire],score:['s1',S1.starGold],coin:['s2',S2.coin]};
    const [sh,sp]=map[this.type]||map.coin;
    drawSp(sh,sp,this.x,this.y+bob,this.w,this.h,this.t*0.6);
  }
}
function drop(x,y){
  const types=['coin','coin','coin','hp','shield','weapon','score'];
  powerups.push(new PowerUp(x,y,types[Math.floor(Math.random()*types.length)]));
}

// ─────────────────────────────────────────────────────────────────
class Mine{
  constructor(x,y,type){
    this.type=type;this.r=16;this.x=x;this.y=y;
    this.vx=(Math.random()-.5)*26;this.vy=20+Math.random()*16;
    this.dead=false;this.t=Math.random()*6.28;this.hp=2;
  }
  get w(){return this.r*2;} get h(){return this.r*2;}
  get hx(){return this.x-this.r;} get hy(){return this.y-this.r;}
  update(dt){this.t+=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.y>CH+40)this.dead=true;}
  draw(){
    const sp=this.type==='gold'?S2.mineGold:this.type==='blue'?S2.mineBlue:S2.mineRed;
    drawSp('s2',sp,this.x-this.r,this.y-this.r,this.r*2,this.r*2,this.t*0.35);
  }
}

// ─────────────────────────────────────────────────────────────────
//  BLACK HOLE
// ─────────────────────────────────────────────────────────────────
class BlackHole{
  constructor(x,y){this.x=x;this.y=y;this.r=50;this.life=8;this.maxL=8;this.dead=false;this.t=0;}
  update(dt){
    this.t+=dt;this.life-=dt;if(this.life<=0){this.dead=true;return;}
    enemies.forEach(e=>{if(e.dead)return;const dx=this.x-e.x,dy=this.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;if(d<150){e.x+=dx/d*100*dt;e.y+=dy/d*100*dt;}});
    mines.forEach(m=>{if(m.dead)return;const dx=this.x-m.x,dy=this.y-m.y,d=Math.sqrt(dx*dx+dy*dy)||1;if(d<150){m.x+=dx/d*100*dt;m.y+=dy/d*100*dt;}});
  }
  draw(){drawSp('s2',S2.blackHole,this.x-50,this.y-50,100,100,this.t*1.5,Math.min(1,this.life/2)*(0.6+Math.sin(this.t*3)*0.3));}
}

// ─────────────────────────────────────────────────────────────────
//  ENEMY
// ─────────────────────────────────────────────────────────────────
class Enemy{
  constructor(x,y,type){
    this.type=type;
    const sz=type==='asteroidL'?52:type==='asteroidS'?36:46;
    this.w=sz;this.h=sz;this.x=x-sz/2;this.y=y;
    this.hp=type==='asteroidL'?4:type==='asteroidS'?2:2+wave;
    this.maxHp=this.hp;
    this.vy=62+Math.random()*80+wave*3;
    this.vx=(Math.random()-.5)*(type==='ship'?80:50);
    this.rot=0;this.rotSpd=(Math.random()-.5)*3;
    this.dead=false;this.fireT=1+Math.random()*2;
    this.shipCol=type==='ship'?SKEYS.filter(k=>k!==player?.shipKey)[Math.floor(Math.random()*3)]:null;
    this.score=type==='asteroidL'?15:type==='asteroidS'?8:25+wave*2;
    this.t=Math.random()*6.28;this.sinAmp=type==='ship'?28:0;
  }
  update(dt){
    this.t+=dt;this.rot+=this.rotSpd*dt;
    this.y+=this.vy*dt;
    this.x+=this.vx*dt+Math.sin(this.t)*this.sinAmp*dt;
    if(this.y>CH+80||this.x<-120||this.x>CW+120){this.dead=true;return;}
    if(this.type==='ship'){this.fireT-=dt;if(this.fireT<=0){this.fireT=1.8+Math.random()*2;this.shoot();}}
  }
  shoot(){
    if(!player||player.dead)return;
    const cx=this.x+this.w/2,cy=this.y+this.h;
    const dx=(player.x+player.w/2)-cx,dy=(player.y+player.h/2)-cy;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const spd=150+wave*10;
    bullets.push(new Bullet(cx,cy,dx/d*spd,dy/d*spd,1,'enemy',EWPN));
  }
  takeDmg(d){
    this.hp-=d;burst(this.x+this.w/2,this.y+this.h/2,'#fa8',4);
    if(this.hp<=0)this.die();
  }
  die(){
    this.dead=true;bigBurst(this.x+this.w/2,this.y+this.h/2);sfxBoom(false);
    score+=this.score;waveKills++;
    if(Math.random()<0.18)drop(this.x+this.w/2,this.y+this.h/2);
  }
  draw(){
    if(this.type==='ship'){
      drawSp('s2',SHIPS[this.shipCol||'blue'].sp,this.x,this.y,this.w,this.h,Math.PI);
    } else {
      drawSp('s2',this.type==='asteroidL'?S2.asteroidL:S2.asteroidS,this.x,this.y,this.w,this.h,this.rot);
    }
    if(this.hp<this.maxHp){
      ctx.fillStyle='#400';ctx.fillRect(this.x,this.y-5,this.w,3);
      ctx.fillStyle='#f44';ctx.fillRect(this.x,this.y-5,this.w*(this.hp/this.maxHp),3);
    }
  }
}

// ─────────────────────────────────────────────────────────────────
//  BOSS
// ─────────────────────────────────────────────────────────────────
class Boss{
  constructor(){
    this.w=180;this.h=100;this.x=(CW-180)/2;this.y=-110;
    this.hp=80+wave*30;this.maxHp=this.hp;
    this.dead=false;this.t=0;this.fireT=0;this.entry=true;this.shk=0;
  }
  get hb(){return{x:this.x+20,y:this.y+12,w:this.w-40,h:this.h-18};}
  update(dt){
    this.t+=dt;
    if(this.entry){this.y+=70*dt;if(this.y>=28){this.y=28;this.entry=false;}return;}
    this.x=(CW-this.w)/2+Math.sin(this.t*0.7)*((CW-this.w)/2-8);
    this.shk=this.hp<this.maxHp*0.3?Math.sin(this.t*18)*3:0;
    this.fireT-=dt;
    if(this.fireT<=0){this.fireT=Math.max(0.3,1.1-wave*0.05);this.fire();}
  }
  fire(){
    const cx=this.x+this.w/2,cy=this.y+this.h;
    const pct=this.hp/this.maxHp;
    const n=pct<0.3?9:pct<0.6?6:3;
    for(let i=0;i<n;i++){
      const a=((i-(n-1)/2)/(Math.max(n-1,1)))*(pct<0.4?2.2:1.4);
      const spd=170+wave*8;
      const bwpn={sheet:'s1',sp:S1.rocketGrey,dmg:2,spd:0,rw:16,rh:34,cnt:1,ang:0,lbl:''};
      bullets.push(new Bullet(cx,cy,Math.sin(a)*spd,Math.cos(a)*spd,2,'enemy',bwpn));
    }
    if(Math.random()<0.28)mines.push(new Mine(cx,cy,['red','gold','blue'][Math.floor(Math.random()*3)]));
  }
  takeDmg(d){
    this.hp-=d;this.shk=(Math.random()-.5)*6;
    if(this.hp<=0)this.die();
  }
  die(){
    this.dead=true;sfxBoom(true);score+=500+wave*100;
    for(let i=0;i<5;i++)setTimeout(()=>bigBurst(this.x+Math.random()*this.w,this.y+Math.random()*this.h),i*120);
    for(let i=0;i<5;i++)drop(this.x+Math.random()*this.w,this.y+this.h/2);
  }
  draw(){
    drawSp('s1',S1.boss,this.x+this.shk,this.y,this.w,this.h);
    const bw=160,bx=(CW-bw)/2,by=CH-22;
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(bx-2,by-2,bw+4,12);
    ctx.fillStyle='#400';ctx.fillRect(bx,by,bw,8);
    const p=this.hp/this.maxHp;
    ctx.fillStyle=p>0.5?'#f80':p>0.25?'#fa0':'#f44';
    ctx.fillRect(bx,by,bw*p,8);
    ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,8);
    ctx.textAlign='center';ctx.font='7px monospace';ctx.fillStyle='#fff';
    ctx.fillText('BOSS WAVE '+wave,CW/2,by+7);ctx.textAlign='left';
  }
}

// ─────────────────────────────────────────────────────────────────
//  PLAYER
// ─────────────────────────────────────────────────────────────────
class Player{
  constructor(shipKey){
    const cfg=SHIPS[shipKey];
    this.shipKey=shipKey;this.cfg=cfg;
    this.w=50;this.h=50;this.x=(CW-50)/2;this.y=CH-90;
    this.hp=cfg.hp;this.maxHp=cfg.hp;
    this.spd=cfg.spd;this.fr=cfg.fr;
    this.fireT=0;this.wLvl=0;this.kills=0;this.killsNext=6;
    this.shield=false;this.shieldT=0;
    this.inv=false;this.invT=0;
    this.dead=false;this.touch=null;
  }
  update(dt){
    // mouvement
    const s=this.spd*dt;
    if(this.touch){
      const tx=this.touch.x-this.w/2,ty=this.touch.y-this.h/2-32;
      const dx=tx-this.x,dy=ty-this.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>2){this.x+=dx/d*Math.min(d,s*3);this.y+=dy/d*Math.min(d,s*3);}
    } else {
      if(keys.ArrowLeft||keys.q||keys.Q)this.x-=s;
      if(keys.ArrowRight||keys.d||keys.D)this.x+=s;
      if(keys.ArrowUp||keys.z||keys.Z)this.y-=s;
      if(keys.ArrowDown||keys.s||keys.S)this.y+=s;
    }
    this.x=Math.max(0,Math.min(CW-this.w,this.x));
    this.y=Math.max(0,Math.min(CH-this.h,this.y));
    // tir auto
    this.fireT-=dt;
    if(this.fireT<=0){this.fireT=this.fr;this.shoot();}
    if(this.shield){this.shieldT-=dt;if(this.shieldT<=0)this.shield=false;}
    if(this.inv){this.invT-=dt;if(this.invT<=0)this.inv=false;}
  }
  shoot(){
    const wpn=WEAPONS[this.wLvl];
    const cx=this.x+this.w/2, cy=this.y+6;  // haut du vaisseau
    sfxLaser(this.wLvl);
    for(let i=0;i<wpn.cnt;i++){
      const sp=wpn.cnt>1?(i-(wpn.cnt-1)/2)*wpn.ang:0;
      bullets.push(new Bullet(cx,cy, Math.sin(sp)*wpn.spd, -Math.cos(sp)*wpn.spd, wpn.dmg,'player',wpn));
    }
  }
  addKill(){
    this.kills++;
    if(this.kills>=this.killsNext&&this.wLvl<WEAPONS.length-1){
      this.wLvl++;this.kills=0;this.killsNext=Math.floor(this.killsNext*1.4);
      sfxWpnUp();showMsg('⬆ '+WEAPONS[this.wLvl].lbl,'#ff0');
    }
  }
  hit(){
    if(this.shield||this.inv)return;
    this.hp--;sfxHurt();
    this.inv=true;this.invT=1.8;
    burst(this.x+this.w/2,this.y+this.h/2,'#f55',8);
    if(this.hp<=0){this.dead=true;bigBurst(this.x+this.w/2,this.y+this.h/2);}
  }
  draw(){
    if(this.dead)return;
    if(this.inv&&Math.floor(Date.now()/80)%2===0)return;
    drawSp('s2',this.cfg.sp,this.x,this.y,this.w,this.h);
    if(this.shield){
      ctx.save();ctx.strokeStyle='rgba(80,200,255,0.85)';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(this.x+this.w/2,this.y+this.h/2,this.w*0.72,0,Math.PI*2);ctx.stroke();
      drawSp('s2',S2.shield,this.x-8,this.y-8,this.w+16,this.h+16,0,0.4);
      ctx.restore();
    }
  }
}

// ─────────────────────────────────────────────────────────────────
//  GAME LOGIC
// ─────────────────────────────────────────────────────────────────
function startGame(sk){
  initAudio();startMusic();
  player=new Player(sk);
  enemies=[];bullets=[];particles=[];powerups=[];mines=[];blackHoles=[];floatMsgs=[];
  score=0;wave=1;waveKills=0;waveKillsNeeded=10;spawnTimer=0;boss=null;bhTimer=0;
  state='playing';
  showMsg('WAVE 1','#7df');
}

function spawnEnemy(){
  const x=44+Math.random()*(CW-88);
  const r=Math.random();
  let t;
  if(wave<3)      t=r<0.5?'asteroidS':'asteroidL';
  else if(wave<6) t=r<0.35?'ship':r<0.65?'asteroidS':'asteroidL';
  else            t=r<0.45?'ship':r<0.7?'asteroidS':'asteroidL';
  enemies.push(new Enemy(x,-60,t));
}

function updateWave(dt){
  if(boss)return;
  spawnTimer-=dt;
  if(spawnTimer<=0){spawnTimer=Math.max(0.32,1.5-wave*0.09);spawnEnemy();}
  if(Math.random()<0.003*wave)mines.push(new Mine(Math.random()*CW,-20,['red','gold','blue'][Math.floor(Math.random()*3)]));
  bhTimer-=dt;
  if(wave>=5&&bhTimer<=0){bhTimer=13+Math.random()*9;blackHoles.push(new BlackHole(80+Math.random()*(CW-160),80+Math.random()*180));showMsg('⚫ TROU NOIR','#d8f');}
  if(waveKills>=waveKillsNeeded&&!boss){
    enemies=[];mines=[];
    boss=new Boss();sfxBossRoar();
    showMsg('⚠ BOSS WAVE '+wave,'#f44');
  }
}

function nextWave(){
  wave++;waveKills=0;waveKillsNeeded=10+wave*4;spawnTimer=0;boss=null;
  if(player&&player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+1);showMsg('+1 ❤','#f88');}
  showMsg('WAVE '+wave,'#7df');
}

function updateGame(dt){
  updStars(dt,0.55);
  if(player&&!player.dead)player.update(dt);
  updateWave(dt);
  if(boss&&!boss.dead)boss.update(dt);
  enemies.forEach(e=>e.update(dt));
  mines.forEach(m=>m.update(dt));
  bullets.forEach(b=>b.update(dt));
  particles.forEach(p=>p.update(dt));
  powerups.forEach(p=>p.update(dt));
  blackHoles.forEach(h=>h.update(dt));
  updMsgs(dt);

  // bullets joueur → ennemis/boss/mines
  bullets.filter(b=>b.owner==='player'&&!b.dead).forEach(b=>{
    enemies.filter(e=>!e.dead).forEach(e=>{
      if(boxHit(b,e)){b.dead=true;e.takeDmg(b.dmg);if(e.dead)player?.addKill();}
    });
    if(boss&&!boss.dead){
      const hb=boss.hb;
      if(boxHit(b,hb)){b.dead=true;boss.takeDmg(b.dmg);}
    }
    mines.filter(m=>!m.dead).forEach(m=>{
      if(circHit(b.x+b.w/2,b.y+b.h/2,b.w/2,m.x,m.y,m.r)){
        b.dead=true;m.hp-=b.dmg;
        if(m.hp<=0){m.dead=true;bigBurst(m.x,m.y);sfxBoom(false);score+=20;waveKills++;}
      }
    });
  });

  // bullets ennemis + ennemis + mines → joueur
  if(player&&!player.dead){
    bullets.filter(b=>b.owner==='enemy'&&!b.dead).forEach(b=>{
      if(boxHit(b,player)){b.dead=true;player.hit();}
    });
    enemies.filter(e=>!e.dead).forEach(e=>{
      if(boxHit(e,player)){e.dead=true;bigBurst(e.x+e.w/2,e.y+e.h/2);player.hit();score+=5;waveKills++;}
    });
    mines.filter(m=>!m.dead).forEach(m=>{
      if(circHit(player.x+player.w/2,player.y+player.h/2,player.w*0.4,m.x,m.y,m.r*0.8)){
        m.dead=true;player.hit();bigBurst(m.x,m.y);
      }
    });
    powerups.filter(p=>!p.dead).forEach(p=>{
      if(boxHit(p,player)){
        p.dead=true;sfxPickup();
        switch(p.type){
          case 'hp':     if(player.hp<player.maxHp){player.hp++;showMsg('+❤','#f88');}break;
          case 'shield': player.shield=true;player.shieldT=6;showMsg('SHIELD ON','#5af');break;
          case 'weapon': if(player.wLvl<WEAPONS.length-1){player.wLvl++;player.kills=0;sfxWpnUp();showMsg('⬆ '+WEAPONS[player.wLvl].lbl,'#ff0');}break;
          case 'score':  score+=200;showMsg('+200','#fc0');break;
          default:       score+=50;showMsg('+50','#aaa');break;
        }
      }
    });
  }

  if(boss&&boss.dead)nextWave();

  enemies=enemies.filter(e=>!e.dead);
  bullets=bullets.filter(b=>!b.dead);
  particles=particles.filter(p=>!p.dead);
  powerups=powerups.filter(p=>!p.dead);
  mines=mines.filter(m=>!m.dead);
  blackHoles=blackHoles.filter(h=>!h.dead);

  if(player&&player.dead){
    if(score>hiScore){hiScore=score;localStorage.setItem('vsHi',hiScore);}
    stopMusic();state='gameover';goAnim=0;
  }
}

function drawGame(){
  ctx.fillStyle='#000010';ctx.fillRect(0,0,CW,CH);

  blackHoles.forEach(h=>h.draw());
  powerups.forEach(p=>p.draw());
  mines.forEach(m=>m.draw());
  enemies.forEach(e=>e.draw());
  if(boss&&!boss.dead)boss.draw();
  bullets.forEach(b=>b.draw());

function drawHUD(){

// ─────────────────────────────────────────────────────────────────
//  UTILS
// ─────────────────────────────────────────────────────────────────
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

// ─────────────────────────────────────────────────────────────────
//  INPUT
// ─────────────────────────────────────────────────────────────────
const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);

function cxy(e){
  const r=canvas.getBoundingClientRect(),sx=CW/r.width,sy=CH/r.height;
  const t=e.touches?e.touches[0]:e;
  return{x:(t.clientX-r.left)*sx,y:(t.clientY-r.top)*sy};
}
canvas.addEventListener('touchstart',e=>{e.preventDefault();const p=cxy(e);tap(p.x,p.y);if(player)player.touch=p;},{passive:false});
canvas.addEventListener('touchmove', e=>{e.preventDefault();const p=cxy(e);if(player)player.touch=p;},{passive:false});
canvas.addEventListener('touchend',  e=>{e.preventDefault();if(player)player.touch=null;},{passive:false});
canvas.addEventListener('click',e=>{const p=cxy(e);tap(p.x,p.y);});
canvas.addEventListener('mousemove',e=>{
  if(state!=='select')return;
  const{x,y}=cxy(e);selHover=null;
  SKEYS.forEach((k,i)=>{const b=getBox(i);if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)selHover=k;});
});
function tap(x,y){
  if(state==='select'){
    SKEYS.forEach((k,i)=>{const b=getBox(i);if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)startGame(k);});
  } else if(state==='gameover'){
    startGame(player?.shipKey||'blue');
  }
}

// ─────────────────────────────────────────────────────────────────
//  LOOP
// ─────────────────────────────────────────────────────────────────
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);lastT=ts;
  ctx.clearRect(0,0,CW,CH);
  if(state==='select')                  {updStars(dt);drawSelect(dt);}
  else if(state==='playing')            {updateGame(dt);drawGame();}
  else if(state==='gameover')           {updStars(dt);drawGameOver(dt);}
  requestAnimationFrame(loop);
}

// ─────────────────────────────────────────────────────────────────
//  BOOT — attendre que les images soient chargées
// ─────────────────────────────────────────────────────────────────
function boot(){
  state='select';
  requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);});
}
loadImages(boot);
// Fallback si images introuvables après 2s
setTimeout(()=>{ if(state==='loading') boot(); },2000);
</script>
